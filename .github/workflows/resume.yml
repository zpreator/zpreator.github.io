name: Build resume PDF
on:
  push:
    branches: [master]
    paths: [resume.md, resume.css, build-resume.sh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: ./build-resume.sh
        env:
          CHROME: google-chrome
      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add resume.pdf
          git diff --cached --quiet || (git commit -m "Rebuild resume.pdf" && git push)
